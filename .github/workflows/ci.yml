name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # A real interpreter with writable site-packages: `python -I` ignores the user site that the system pip falls back to.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y ffmpeg fonts-inter && python -I worker/test_media.py
      - run: python -m pip install -r worker/requirements-dev.txt && python -I worker/test_render.py
# Preview deployments: connect the repo in Vercel (Git integration builds every PR).
