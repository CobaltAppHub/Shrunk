name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: sudo apt-get install -y ffmpeg fonts-inter && python3 -I worker/test_media.py
      - run: pip install -r worker/requirements-dev.txt && python3 -I worker/test_render.py
# Preview deployments: connect the repo in Vercel (Git integration builds every PR).
